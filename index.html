<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="card art" role="img" aria-label="Blurred artwork placeholder">
      <div class="art-img"></div>
    </div>
    <div class="card panel">
      <div class="ring">
        <div class="ring-in">
          <div class="time">25:00</div>
          <p class="label">Ready to focus</p>
        </div>
      </div>
      <div class="buttons">
        <button type="button" class="btn primary">Start</button>
        <button type="button" class="btn secondary">Reset</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
