<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="screen">
    <div class="card art" role="img" aria-label="Blurred artwork placeholder">
      <div class="art-img" id="artImg"></div>
    </div>
    <div class="card panel">
      <div class="ring" id="ring">
        <div class="ring-in">
          <div class="time" id="time">00:30</div>
          <p class="label" id="label">Ready to focus</p>
        </div>
      </div>
      <div class="buttons">
        <button type="button" class="btn primary" id="startPause">Start</button>
        <button type="button" class="btn secondary" id="reset">Reset</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
