<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mockup: Paper Poster</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Helvetica Neue",Arial,sans-serif;background:#dedad3;color:#3d3a36;padding:24px 16px 48px}
.sheet-head{max-width:1100px;margin:0 auto 28px}
.sheet-head h1{font-size:22px;font-weight:600}
.sheet-head p{margin-top:6px;font-size:14px;color:#6b665f}
h2.group{max-width:1100px;margin:36px auto 12px;font-size:16px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#6b665f}
.stage{max-width:1100px;margin:0 auto;overflow-x:auto;padding:12px}
.row{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
figure{flex:none}
figcaption{font-size:14px;font-weight:600;margin-bottom:16px;color:#4a4640}
.screen{overflow:hidden}
.screen.laptop{width:960px;min-height:520px;border-radius:12px;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.screen.phone{width:360px;border-radius:30px;box-shadow:0 0 0 8px #2b2926}
.art{overflow:hidden;position:relative}
.art-img{position:absolute;inset:-40px;background:radial-gradient(circle at 28% 30%,#fbe38a 0 11%,transparent 11.5%),radial-gradient(circle at 72% 62%,#1f3a4d 0 16%,transparent 16.5%),repeating-linear-gradient(115deg,transparent 0 38px,rgba(255,255,255,.35) 38px 46px),linear-gradient(135deg,#e9b44c 0%,#c8553d 45%,#6d4c7d 75%,#2f4858 100%);filter:blur(var(--blur))}
.art.sharp .art-img,.art-img.sharp{inset:0}
.time{font-variant-numeric:tabular-nums}
.btn{font:inherit;border:0;cursor:default}
.details{text-align:left}
.details .name{font-weight:600}
.details a{color:inherit}

.screen{background:#faf8f3;color:#34312d}
.laptop{display:flex;min-height:520px}
.laptop .art{flex:2;min-height:520px}
.laptop .panel{flex:1;padding:48px 36px;border-left:1px solid #d8d2c4;display:flex;flex-direction:column;justify-content:center}
.phone .art{width:100%;aspect-ratio:4/3}
.phone .panel{padding:28px 24px 36px;border-top:1px solid #d8d2c4}
.label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#8d867a;margin-bottom:14px}
.time{font-size:64px;font-weight:300;letter-spacing:-.01em;line-height:1}
.phone .time{font-size:56px}
.buttons{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap}
.btn{padding:13px 24px;border-radius:999px;font-size:15px;color:#4a4439;background:#ebe3d1}
.btn.primary{background:#ddd0b4}
.details{margin-top:32px;padding-top:16px;border-top:1px solid #d8d2c4;font-size:14px;line-height:1.6;color:#5c564b}
.details .name{font-size:17px;color:#34312d}
</style>
</head>
<body>
<div class="sheet-head"><h1>Mockup: Paper Poster</h1><p>A big frameless painting beside a narrow, poster-style timer column. Design only: nothing works yet, and the painting is a coloured placeholder.</p></div>
<h2 class="group">Laptop-sized screen</h2><div class="stage"><div class="row"><figure><figcaption>1. Before starting</figcaption><section class="screen laptop"><div class="art"><div class="art-img" style="--blur:26px"></div></div><div class="panel"><p class="label">Ready to focus</p><div class="time">25:00</div><div class="buttons"><button type="button" class="btn primary">Start</button><button type="button" class="btn secondary">Reset</button></div></div></section></figure><figure><figcaption>2. Timer running</figcaption><section class="screen laptop"><div class="art"><div class="art-img" style="--blur:10px"></div></div><div class="panel"><p class="label">Focusing</p><div class="time">14:32</div><div class="buttons"><button type="button" class="btn primary">Pause</button><button type="button" class="btn secondary">Reset</button></div></div></section></figure><figure><figcaption>3. Timer finished</figcaption><section class="screen laptop"><div class="art"><div class="art-img" style="--blur:0px;inset:0"></div></div><div class="panel"><p class="label">Session complete</p><div class="time">00:00</div><div class="buttons"><button type="button" class="btn primary">Restart session</button></div><div class="details"><p class="name">Painting name</p><p>Artist name</p><p>Year</p><p><a href="#">Read about this painting on the Met website</a></p></div></div></section></figure></div></div><h2 class="group">Phone-sized screen</h2><div class="stage"><div class="row"><figure><figcaption>1. Before starting</figcaption><section class="screen phone"><div class="art"><div class="art-img" style="--blur:26px"></div></div><div class="panel"><p class="label">Ready to focus</p><div class="time">25:00</div><div class="buttons"><button type="button" class="btn primary">Start</button><button type="button" class="btn secondary">Reset</button></div></div></section></figure><figure><figcaption>2. Timer running</figcaption><section class="screen phone"><div class="art"><div class="art-img" style="--blur:10px"></div></div><div class="panel"><p class="label">Focusing</p><div class="time">14:32</div><div class="buttons"><button type="button" class="btn primary">Pause</button><button type="button" class="btn secondary">Reset</button></div></div></section></figure><figure><figcaption>3. Timer finished</figcaption><section class="screen phone"><div class="art"><div class="art-img" style="--blur:0px;inset:0"></div></div><div class="panel"><p class="label">Session complete</p><div class="time">00:00</div><div class="buttons"><button type="button" class="btn primary">Restart session</button></div><div class="details"><p class="name">Painting name</p><p>Artist name</p><p>Year</p><p><a href="#">Read about this painting on the Met website</a></p></div></div></section></figure></div></div>
</body>
</html>
